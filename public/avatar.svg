<svg width="280" height="280" viewBox="0 0 280 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <!-- 更沉稳的浅色渐变：降低整体亮度、保持温润质感 -->
        <stop offset="0" stop-color="#f6f5f7"/>
        <stop offset="1" stop-color="#f3f2f5"/>
    </linearGradient>
  </defs>
  <rect width="280" height="280" rx="28" fill="url(#g1)"/>
  <!-- soft inner accent using cool blue for subtle variation -->
  <rect x="18" y="18" width="244" height="244" rx="22" fill="url(#g1)" opacity="0.02" />
  <!-- faint outer ring for subtle glow -->
  <rect x="6" y="6" width="268" height="268" rx="24" fill="none" stroke="rgba(80,72,140,0.06)" stroke-width="12"/>
  <rect x="0" y="0" width="280" height="280" rx="28" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" />
  <g transform="translate(40,40)">
    <circle cx="100" cy="60" r="36" fill="#fff" opacity="0.12" />
    <circle cx="100" cy="60" r="36" fill="#fafafa" />
    <rect x="36" y="120" width="128" height="86" rx="14" fill="#ffffff" opacity="0.08" />
    <rect x="36" y="120" width="128" height="86" rx="14" fill="#fff" opacity="0.12" />
  </g>
  <!-- small soft top-right highlight -->
  <circle cx="210" cy="30" r="10" fill="rgba(255,255,255,0.4)" opacity="0.22" />
</svg>
